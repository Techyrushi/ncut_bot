<VirtualHost *:80>
    ServerName ncut-app.ssdit.in
    DocumentRoot /var/www/ncut-app/frontend/dist

    <Directory /var/www/ncut-app/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/ncut-app-error.log
    CustomLog ${APACHE_LOG_DIR}/ncut-app-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName ncut-api.ssdit.in

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5000/ connectiontimeout=5 timeout=60 retry=0
    ProxyPassReverse / http://127.0.0.1:5000/

    ErrorLog ${APACHE_LOG_DIR}/ncut-api-error.log
    CustomLog ${APACHE_LOG_DIR}/ncut-api-access.log combined
</VirtualHost>
