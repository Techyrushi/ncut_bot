openapi: 3.1.0
info:
  title: WhatsApp Product Catalogue & Sales Automation API
  version: 1.0.0
  description: REST API for the catalogue, customer conversations, WhatsApp Cloud API, and sales leads.
servers:
  - url: http://localhost:5000/api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Check API and MongoDB readiness
      responses:
        '200': { description: Ready }
        '503': { description: Database unavailable }
  /auth/login:
    post:
      security: []
      summary: Authenticate a workspace user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        '200': { description: Bearer token and user }
        '401': { description: Invalid credentials }
  /auth/logout:
    post:
      summary: Revoke the current bearer token
      responses:
        '200': { description: Logged out }
        '401': { description: Unauthorized }
  /auth/me:
    get:
      summary: Return the current authenticated principal
      responses:
        '200': { description: Current user }
  /auth/account:
    patch:
      summary: Change the current user's email and/or password
      description: Requires the current password, rotates the bearer token, and invalidates existing sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword]
              anyOf:
                - required: [email]
                - required: [newPassword]
              properties:
                currentPassword: { type: string, minLength: 1 }
                email: { type: string, format: email }
                newPassword: { type: string, minLength: 12, maxLength: 200 }
      responses:
        '200': { description: Updated identity and replacement bearer token }
        '403': { description: Current password is incorrect }
        '409': { description: Email address is already in use }
  /products:
    get:
      summary: List products
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
      responses:
        '200': { description: Paginated catalogue }
    post:
      summary: Create a verified product record
      responses:
        '201': { description: Product created }
        '400': { description: Validation error }
  /products/categories:
    get:
      summary: List distinct categories already used by catalogue products
      responses:
        '200': { description: Catalogue categories for product entry and filtering }
  /products/image-upload:
    post:
      summary: Upload a product image for WhatsApp
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        '201': { description: Public image URL returned }
        '400': { description: Invalid image content }
        '413': { description: Image exceeds 5 MiB }
  /products/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Get product details
      responses:
        '200': { description: Product }
        '404': { description: Not found }
    put:
      summary: Update product fields
      responses:
        '200': { description: Product updated }
    delete:
      summary: Archive product
      responses:
        '200': { description: Product archived }
  /customers:
    get:
      summary: Search customers
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: limit, schema: { type: integer, maximum: 100 } }
        - { in: query, name: optInStatus, schema: { type: string, enum: [UNKNOWN, OPTED_IN, OPTED_OUT] } }
      responses:
        '200': { description: Paginated customer directory }
  /customers/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Get customer details
      responses:
        '200': { description: Customer }
        '404': { description: Not found }
  /customers/{id}/opt-in:
    patch:
      summary: Record explicit customer consent or opt-out
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, source]
              properties:
                status: { type: string, enum: [OPTED_IN, OPTED_OUT] }
                source: { type: string, maxLength: 500 }
      responses:
        '200': { description: Consent status recorded }
  /conversations:
    get:
      summary: List conversations
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [OPEN, HUMAN_HANDOVER, CLOSED] } }
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: limit, schema: { type: integer, maximum: 100 } }
      responses:
        '200': { description: Paginated conversation list }
  /conversations/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Get a conversation
      responses:
        '200': { description: Conversation details }
  /conversations/{id}/messages:
    get:
      summary: Read a conversation history
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: before, schema: { type: string, format: date-time } }
        - { in: query, name: limit, schema: { type: integer, maximum: 100 } }
      responses:
        '200': { description: Chronological messages }
  /conversations/{id}/read:
    post:
      summary: Send a WhatsApp read receipt and clear unread inbound messages
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Read receipt recorded }
        '502': { description: WhatsApp rejected the read receipt }
  /conversations/{id}/status:
    patch:
      summary: Close a human-managed conversation
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [CLOSED] }
      responses:
        '200': { description: Conversation closed }
  /conversations/{id}/resume-automation:
    post:
      summary: Resume automated messaging after a human handover
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Automation resumed and product-selection state reset }
        '404': { description: Conversation not found }
        '409': { description: Conversation is not in human handover }
  /leads:
    get:
      summary: Search, filter, and paginate sales leads
      parameters:
        - { in: query, name: search, description: Search customer name/number, product name/category, customer requirement, or lead ID, schema: { type: string, maxLength: 200 } }
        - { in: query, name: status, schema: { type: string, enum: [NEW, CONTACTED, QUALIFIED, WON, LOST] } }
        - { in: query, name: assignedSalesPerson, description: Use assigned, unassigned, or a sales user ID, schema: { type: string } }
        - { in: query, name: startDate, description: Inclusive creation date in UTC, schema: { type: string, format: date } }
        - { in: query, name: endDate, description: Inclusive creation date in UTC, schema: { type: string, format: date } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: limit, schema: { type: integer, maximum: 100 } }
      responses:
        '200': { description: Paginated leads }
        '400': { description: Invalid filter or date range }
  /leads/export.csv:
    get:
      summary: Export every lead matching the active filters as CSV
      parameters:
        - { in: query, name: search, schema: { type: string, maxLength: 200 } }
        - { in: query, name: status, schema: { type: string, enum: [NEW, CONTACTED, QUALIFIED, WON, LOST] } }
        - { in: query, name: assignedSalesPerson, schema: { type: string } }
        - { in: query, name: startDate, schema: { type: string, format: date } }
        - { in: query, name: endDate, schema: { type: string, format: date } }
      responses:
        '200': { description: Filtered CSV file }
  /leads/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      summary: Get lead details
      responses:
        '200': { description: Lead, customer, and products }
  /leads/{id}/status:
    patch:
      summary: Update lead status
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [NEW, CONTACTED, QUALIFIED, WON, LOST] }
      responses:
        '200': { description: Status updated }
  /leads/{id}/assign:
    patch:
      summary: Assign a sales representative
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        '200': { description: Lead assigned }
  /bulk-campaigns/media:
    post:
      summary: Upload a WhatsApp campaign attachment
      description: Administrator-only raw binary upload. Images are limited to 5 MiB, MP4 to 16 MiB, and supported documents to 20 MiB.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          video/mp4:
            schema: { type: string, format: binary }
          application/pdf:
            schema: { type: string, format: binary }
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201': { description: Uploaded asset metadata and public WhatsApp-fetchable URL }
        '400': { description: Invalid binary content }
        '413': { description: Attachment exceeds its size limit }
  /bulk-campaigns:
    get:
      summary: List campaign previews and delivery summaries
      responses:
        '200': { description: Paginated administrator campaign history }
    post:
      summary: Create a campaign draft
      description: Requires message text or an uploaded attachment. Does not send messages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                message: { type: string, maxLength: 4096 }
                attachment: { type: object, description: Metadata returned by the media upload endpoint }
      responses:
        '201': { description: Draft campaign created }
        '400': { description: Invalid campaign content }
  /bulk-campaigns/{id}/import:
    post:
      summary: Import and preview campaign recipients
      description: Accepts CSV or XLSX with a phone/mobile column or first-column phone numbers. Deduplicates normalized numbers and marks unknown, non-opted-in, and expired-window recipients UNSENT.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, format: binary }
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary }
      responses:
        '200': { description: Eligibility preview with duplicate, eligible, and unsent counts }
        '409': { description: Campaign is not a draft or recipients were already imported }
        '413': { description: Import exceeds the 5 MiB, 5,000-row, or 500-unique-recipient limit }
  /bulk-campaigns/{id}/send:
    post:
      summary: Queue a previewed campaign for paced delivery
      description: Queues only recipients still eligible for sending. The worker rechecks opt-in and the 24-hour service window before each message.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '202': { description: Campaign queued for delivery }
        '409': { description: Campaign is not ready or has no eligible recipients }
  /bulk-campaigns/{id}:
    get:
      summary: Read campaign progress and recipient delivery statuses
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [UNSENT, QUEUED, SENDING, SENT, DELIVERED, READ, FAILED] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Campaign detail, recipient page, and per-status counts }
        '404': { description: Campaign not found }
  /bulk-campaigns/{id}/export.csv:
    get:
      summary: Export campaign recipient activity
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [UNSENT, QUEUED, SENDING, SENT, DELIVERED, READ, FAILED] } }
      responses:
        '200': { description: Formula-safe CSV recipient activity export }
  /team:
    get:
      summary: List sales representatives
      responses:
        '200': { description: Sales team }
    post:
      summary: Add a sales representative
      responses:
        '201': { description: Sales representative created }
  /team/{id}:
    patch:
      summary: Activate or deactivate a sales representative
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Representative updated }
  /templates:
    get:
      summary: List registered WhatsApp templates
      responses:
        '200': { description: Template registry }
    post:
      summary: Register a template and its verified status
      responses:
        '201': { description: Template registered }
  /templates/{id}/status:
    patch:
      summary: Update a template's Meta approval status
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Template status updated }
  /whatsapp/send-message:
    post:
      summary: Send a free-form message within the 24-hour service window
      responses:
        '201': { description: Message sent and recorded }
        '409': { description: Service window expired or customer opted out }
  /whatsapp/send-image:
    post:
      summary: Send an image within the 24-hour service window
      responses:
        '201': { description: Image sent and recorded }
  /whatsapp/send-template:
    post:
      summary: Send an approved template to an opted-in customer
      responses:
        '201': { description: Template message sent and recorded }
        '409': { description: Customer opt-in is missing }
  /whatsapp/configuration:
    get:
      summary: Read safe WhatsApp configuration status
      responses:
        '200': { description: Configuration status; secrets are never returned }
  /whatsapp/configuration/test-connection:
    post:
      summary: Read-only test of the Meta phone-number credentials
      responses:
        '200': { description: Meta phone-number status and public display metadata }
        '502': { description: Meta rejected the token or phone-number ID }
  /settings/workspace:
    get:
      summary: Read public workspace settings
      responses:
        '200': { description: Business number and welcome text }
    patch:
      summary: Update business number and automation welcome text
      responses:
        '200': { description: Workspace settings saved }
  /logs:
    get:
      summary: Search paginated activity and system events (administrator only)
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { in: query, name: source, schema: { type: string, enum: [USER, SYSTEM] } }
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
      responses:
        '200': { description: Paginated activity records }
        '401': { description: Unauthorized }
        '403': { description: Administrator role required }
  /webhooks/whatsapp:
    get:
      security: []
      summary: Verify Meta webhook subscription
      parameters:
        - { in: query, name: hub.mode, schema: { type: string } }
        - { in: query, name: hub.verify_token, schema: { type: string } }
        - { in: query, name: hub.challenge, schema: { type: string } }
      responses:
        '200': { description: Challenge returned }
        '403': { description: Verification rejected }
    post:
      security: []
      summary: Receive signed Meta webhook events
      parameters:
        - { in: header, name: X-Hub-Signature-256, required: true, schema: { type: string } }
      responses:
        '200': { description: Event durably queued }
        '401': { description: Invalid signature }
  /dashboard/stats:
    get:
      summary: Aggregate sales dashboard counters
      responses:
        '200': { description: Dashboard metrics }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
